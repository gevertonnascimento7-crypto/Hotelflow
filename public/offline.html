<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HotelFlow</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, Roboto, sans-serif; background: #fafafa; color: #111113; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #f4f4f5; } p { color: #9a9aa3 !important; } }
  img { width: 56px; height: 56px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 6px; }
  p { color: #6b6b73; margin: 0 0 24px; }
  button { height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #0f766e; color: #fff; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 id="t">Você está offline</h1>
  <p id="d">Verifique sua conexão e tente novamente.</p>
  <button id="b" onclick="location.reload()">Tentar novamente</button>
</main>
<script>
  var m = { en: ["You are offline", "Check your connection and try again.", "Try again"], es: ["Estás sin conexión", "Revisa tu conexión e inténtalo de nuevo.", "Intentar de nuevo"] };
  try { var l = localStorage.getItem("hf-locale"); if (m[l]) { document.documentElement.lang = l; t.textContent = m[l][0]; d.textContent = m[l][1]; b.textContent = m[l][2]; } } catch (e) {}
</script>
</body>
</html>
